name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs

  render:
    name: Headless render smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/epic-infographics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skills/epic-infographics/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render the skeleton template
        run: node scripts/render.mjs templates/skeleton.html /tmp/skeleton.png --preset square
      - name: Render a shipped example
        run: node scripts/render.mjs ../../examples/streaming-wars/infographic.html /tmp/example.png --preset wide
      - name: Preflight-check the skeleton and a shipped example
        run: |
          node scripts/check.mjs templates/skeleton.html --preset square
          node scripts/check.mjs ../../examples/streaming-wars/infographic.html --preset wide
      - name: Animate a shipped example (frame scrub + ffmpeg)
        run: node scripts/animate.mjs ../../examples/launch-funnel/infographic.html /tmp/example.mp4 --preset square --fps 10 --hold 0
      - name: Assert non-trivial output
        run: |
          # The skeleton is near-empty boilerplate (~18KB locally); the example is a full scene.
          check() {
            size=$(stat -c%s "$1")
            echo "$1: $size bytes (min $2)"
            [ "$size" -gt "$2" ] || { echo "::error::$1 suspiciously small"; exit 1; }
          }
          check /tmp/skeleton.png 5000
          check /tmp/example.png 100000
          check /tmp/example.mp4 50000
